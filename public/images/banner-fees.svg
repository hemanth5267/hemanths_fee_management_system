<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" fill="none">
  <rect width="520" height="160" fill="url(#feeGrad)"/>
  <defs>
    <linearGradient id="feeGrad" x1="0" y1="0" x2="520" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#112952"/>
    </linearGradient>
  </defs>

  <!-- Decorative blobs -->
  <circle cx="460" cy="30"  r="70" fill="#1e4d8c" opacity=".2"/>
  <circle cx="60"  cy="130" r="55" fill="#1e4d8c" opacity=".2"/>

  <!-- Large invoice card -->
  <rect x="150" y="20" width="220" height="130" fill="#1a3a6b" rx="10"/>
  <rect x="150" y="20" width="220" height="36"  fill="#1e4d8c" rx="10"/>
  <rect x="150" y="44" width="220" height="12"  fill="#1e4d8c"/>
  <!-- Invoice header -->
  <text x="260" y="42" font-family="Arial" font-size="11" font-weight="bold" fill="#fbbf24" text-anchor="middle">FEE INVOICE</text>
  <!-- Invoice lines -->
  <rect x="166" y="68" width="100" height="6" fill="#2563b0" rx="2"/>
  <rect x="166" y="82" width="80"  height="6" fill="#2563b0" rx="2" opacity=".7"/>
  <rect x="166" y="96" width="90"  height="6" fill="#2563b0" rx="2" opacity=".6"/>
  <rect x="166" y="110" width="70" height="6" fill="#2563b0" rx="2" opacity=".5"/>
  <!-- Amounts right side -->
  <text x="345" y="74"  font-family="Arial" font-size="9" fill="#fbbf24" text-anchor="end">₹15,000</text>
  <text x="345" y="88"  font-family="Arial" font-size="9" fill="#fbbf24" text-anchor="end">₹3,000</text>
  <text x="345" y="102" font-family="Arial" font-size="9" fill="#fbbf24" text-anchor="end">₹2,000</text>
  <text x="345" y="116" font-family="Arial" font-size="9" fill="#fbbf24" text-anchor="end">₹1,500</text>
  <!-- Divider -->
  <line x1="166" y1="124" x2="354" y2="124" stroke="#2563b0" stroke-width="1"/>
  <!-- Total -->
  <text x="166" y="137" font-family="Arial" font-size="9" font-weight="bold" fill="#ffffff">TOTAL</text>
  <text x="345" y="137" font-family="Arial" font-size="10" font-weight="bold" fill="#fbbf24" text-anchor="end">₹21,500</text>
  <!-- Stamp PAID -->
  <circle cx="310" cy="100" r="30" stroke="#22c55e" stroke-width="3" fill="none" opacity=".5"/>
  <text x="310" y="106" font-family="Arial" font-size="13" font-weight="bold" fill="#22c55e" text-anchor="middle" opacity=".7" transform="rotate(-20,310,100)">PAID</text>

  <!-- Floating coins left -->
  <circle cx="80"  cy="55"  r="30" fill="#f59e0b" opacity=".15"/>
  <circle cx="80"  cy="55"  r="22" fill="#f59e0b" opacity=".2"/>
  <text x="80" y="62" font-family="Arial" font-size="22" font-weight="bold" fill="#fbbf24" text-anchor="middle" opacity=".8">₹</text>
  <circle cx="55"  cy="100" r="18" fill="#f59e0b" opacity=".1"/>
  <text x="55" y="107" font-family="Arial" font-size="14" fill="#fbbf24" text-anchor="middle" opacity=".5">₹</text>
  <circle cx="110" cy="110" r="12" fill="#f59e0b" opacity=".12"/>
  <text x="110" y="116" font-family="Arial" font-size="10" fill="#fbbf24" text-anchor="middle" opacity=".5">₹</text>

  <!-- Floating coins right -->
  <circle cx="440" cy="80"  r="28" fill="#f59e0b" opacity=".15"/>
  <circle cx="440" cy="80"  r="20" fill="#f59e0b" opacity=".2"/>
  <text x="440" y="87" font-family="Arial" font-size="20" font-weight="bold" fill="#fbbf24" text-anchor="middle" opacity=".8">₹</text>
  <circle cx="470" cy="120" r="16" fill="#f59e0b" opacity=".1"/>
  <text x="470" y="127" font-family="Arial" font-size="13" fill="#fbbf24" text-anchor="middle" opacity=".5">₹</text>

  <!-- Sparkles -->
  <text x="130" y="30"  font-family="Arial" font-size="14" fill="#fbbf24" opacity=".5">✦</text>
  <text x="390" y="25"  font-family="Arial" font-size="10" fill="#fbbf24" opacity=".4">✦</text>
  <text x="490" y="50"  font-family="Arial" font-size="8"  fill="#fbbf24" opacity=".4">✦</text>
</svg>
