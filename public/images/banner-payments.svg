<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" fill="none">
  <rect width="520" height="160" fill="url(#payGrad)"/>
  <defs>
    <linearGradient id="payGrad" x1="0" y1="0" x2="520" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#1a3a6b"/>
    </linearGradient>
  </defs>

  <!-- Background blobs -->
  <circle cx="50"  cy="40"  r="65" fill="#1e4d8c" opacity=".2"/>
  <circle cx="470" cy="130" r="60" fill="#1e4d8c" opacity=".2"/>

  <!-- Wallet (left) -->
  <rect x="60" y="40" width="130" height="90" fill="#1a3a6b" rx="10"/>
  <rect x="60" y="40" width="130" height="30" fill="#1e4d8c" rx="10"/>
  <rect x="60" y="58" width="130" height="12" fill="#1e4d8c"/>
  <!-- Wallet clasp -->
  <rect x="175" y="70" width="30" height="30" fill="#2563b0" rx="8"/>
  <circle cx="190" cy="85" r="8" fill="#1a3a6b"/>
  <circle cx="190" cy="85" r="4" fill="#f59e0b"/>
  <!-- Cards inside wallet -->
  <rect x="72" y="80" width="90" height="12" fill="#2563b0" rx="3" opacity=".8"/>
  <rect x="72" y="96" width="70" height="12" fill="#3b82d4" rx="3" opacity=".6"/>
  <text x="125" y="58" font-family="Arial" font-size="10" font-weight="bold" fill="#fbbf24" text-anchor="middle">WALLET</text>

  <!-- Center receipt -->
  <rect x="215" y="15" width="100" height="140" fill="#ffffff" rx="6" opacity=".95"/>
  <!-- Receipt header -->
  <rect x="215" y="15" width="100" height="30" fill="#f59e0b" rx="6"/>
  <rect x="215" y="35" width="100" height="10" fill="#f59e0b"/>
  <text x="265" y="35" font-family="Arial" font-size="9" font-weight="bold" fill="#0a1628" text-anchor="middle">RECEIPT</text>
  <!-- Zigzag bottom of header -->
  <!-- Receipt lines -->
  <rect x="225" y="55"  width="80" height="5" fill="#e2e8f0" rx="2"/>
  <rect x="225" y="66"  width="60" height="5" fill="#e2e8f0" rx="2"/>
  <rect x="225" y="77"  width="70" height="5" fill="#e2e8f0" rx="2"/>
  <line x1="225" y1="90" x2="305" y2="90" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,3"/>
  <!-- Amount -->
  <text x="265" y="108" font-family="Arial" font-size="14" font-weight="bold" fill="#0a1628" text-anchor="middle">₹15,000</text>
  <text x="265" y="120" font-family="Arial" font-size="7" fill="#94a3b8" text-anchor="middle">AMOUNT PAID</text>
  <!-- Checkmark -->
  <circle cx="265" cy="140" r="10" fill="#22c55e" opacity=".9"/>
  <text x="265" y="145" font-family="Arial" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">✓</text>

  <!-- UPI / Mobile payment right -->
  <rect x="340" y="35" width="90" height="105" fill="#1a3a6b" rx="10"/>
  <!-- Phone screen -->
  <rect x="348" y="45" width="74" height="85" fill="#0a1628" rx="6"/>
  <!-- Phone notch -->
  <rect x="368" y="42" width="34" height="6" fill="#112952" rx="3"/>
  <!-- App UI on screen -->
  <rect x="354" y="52" width="62" height="20" fill="#1e4d8c" rx="3"/>
  <text x="385" y="66" font-family="Arial" font-size="8" fill="#fbbf24" text-anchor="middle" font-weight="bold">PAY NOW</text>
  <circle cx="385" cy="95" r="18" fill="#f59e0b" opacity=".9"/>
  <text x="385" y="101" font-family="Arial" font-size="16" font-weight="bold" fill="#0a1628" text-anchor="middle">₹</text>
  <!-- Scan lines -->
  <rect x="354" y="118" width="62" height="4" fill="#2563b0" rx="1" opacity=".6"/>
  <rect x="354" y="126" width="45" height="4" fill="#2563b0" rx="1" opacity=".4"/>
  <!-- Home button -->
  <circle cx="385" cy="148" r="5" fill="#1e4d8c"/>

  <!-- Payment methods floating -->
  <rect x="38"  y="140" width="45" height="14" fill="#2563b0" rx="4"/>
  <text x="60" y="151" font-family="Arial" font-size="7" fill="#fff" text-anchor="middle" font-weight="bold">CASH</text>
  <rect x="90"  y="140" width="45" height="14" fill="#1e4d8c" rx="4"/>
  <text x="112" y="151" font-family="Arial" font-size="7" fill="#fbbf24" text-anchor="middle" font-weight="bold">ONLINE</text>
  <rect x="440" y="20" width="50" height="14" fill="#1e4d8c" rx="4"/>
  <text x="465" y="31" font-family="Arial" font-size="7" fill="#fbbf24" text-anchor="middle" font-weight="bold">CHEQUE</text>
  <rect x="445" y="40" width="40" height="14" fill="#2563b0" rx="4"/>
  <text x="465" y="51" font-family="Arial" font-size="7" fill="#fff" text-anchor="middle" font-weight="bold">UPI</text>

  <!-- Sparkles -->
  <text x="30"  y="90"  font-family="Arial" font-size="14" fill="#fbbf24" opacity=".3">✦</text>
  <text x="490" y="80"  font-family="Arial" font-size="10" fill="#fbbf24" opacity=".3">✦</text>
  <text x="175" y="150" font-family="Arial" font-size="8"  fill="#fbbf24" opacity=".3">✦</text>
</svg>
