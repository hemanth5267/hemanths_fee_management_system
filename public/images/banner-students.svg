<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" fill="none">
  <rect width="520" height="160" fill="url(#stuGrad)"/>
  <defs>
    <linearGradient id="stuGrad" x1="0" y1="0" x2="520" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#1e4d8c"/>
    </linearGradient>
  </defs>
  <!-- Decorative circles -->
  <circle cx="480" cy="20"  r="60" fill="#1e4d8c" opacity=".25"/>
  <circle cx="30"  cy="140" r="50" fill="#112952" opacity=".4"/>
  <circle cx="260" cy="80"  r="90" fill="#112952" opacity=".15"/>

  <!-- Student 1 (left) -->
  <circle cx="120" cy="52" r="22" fill="#2563b0"/>
  <rect x="98"  y="74" width="44" height="52" fill="#1e4d8c" rx="4"/>
  <!-- Graduation cap -->
  <rect x="102" y="38" width="36" height="7" fill="#f59e0b" rx="2"/>
  <rect x="118" y="28" width="4"  height="12" fill="#f59e0b"/>
  <polygon points="102,38 120,28 138,38" fill="#fbbf24"/>
  <!-- Book -->
  <rect x="104" y="90" width="30" height="22" fill="#3b82d4" rx="2"/>
  <line x1="119" y1="90" x2="119" y2="112" stroke="#1a3a6b" stroke-width="1.5"/>

  <!-- Student 2 (center) -->
  <circle cx="260" cy="48" r="26" fill="#f59e0b"/>
  <rect x="234" y="74" width="52" height="58" fill="#f59e0b" rx="4" opacity=".85"/>
  <!-- Graduation cap -->
  <rect x="238" y="32" width="44" height="8"  fill="#0a1628" rx="2"/>
  <rect x="257" y="20" width="6"  height="14" fill="#0a1628"/>
  <polygon points="238,32 260,20 282,32" fill="#0d1f3c"/>
  <!-- Medal -->
  <circle cx="260" cy="102" r="10" fill="#fbbf24"/>
  <text x="260" y="107" font-family="Arial" font-size="10" font-weight="bold" fill="#0a1628" text-anchor="middle">1</text>
  <!-- Tassel -->
  <line x1="282" y1="34" x2="290" y2="52" stroke="#fcd34d" stroke-width="2"/>
  <circle cx="290" cy="55" r="3" fill="#fcd34d"/>

  <!-- Student 3 (right) -->
  <circle cx="400" cy="52" r="22" fill="#2563b0"/>
  <rect x="378" y="74" width="44" height="52" fill="#1e4d8c" rx="4"/>
  <!-- Graduation cap -->
  <rect x="382" y="38" width="36" height="7" fill="#f59e0b" rx="2"/>
  <rect x="398" y="28" width="4"  height="12" fill="#f59e0b"/>
  <polygon points="382,38 400,28 418,38" fill="#fbbf24"/>
  <!-- Diploma scroll -->
  <rect x="384" y="92" width="32" height="20" fill="#fef3c7" rx="3"/>
  <line x1="390" y1="99" x2="410" y2="99" stroke="#f59e0b" stroke-width="1.5"/>
  <line x1="390" y1="104" x2="410" y2="104" stroke="#f59e0b" stroke-width="1.5"/>

  <!-- Ground line -->
  <rect x="0" y="150" width="520" height="10" fill="#0d1f3c" opacity=".5"/>

  <!-- Decorative elements -->
  <text x="30"  y="50" font-family="Arial" font-size="22" opacity=".2">📚</text>
  <text x="460" y="60" font-family="Arial" font-size="22" opacity=".2">✏️</text>

  <!-- Stars/sparkles -->
  <text x="170" y="30" font-family="Arial" font-size="14" fill="#fbbf24" opacity=".5">✦</text>
  <text x="340" y="25" font-family="Arial" font-size="10" fill="#fbbf24" opacity=".5">✦</text>
  <text x="210" y="140" font-family="Arial" font-size="8"  fill="#fbbf24" opacity=".4">✦</text>
  <text x="310" y="145" font-family="Arial" font-size="12" fill="#fbbf24" opacity=".4">✦</text>
</svg>
