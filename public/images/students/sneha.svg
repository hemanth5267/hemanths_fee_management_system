<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <circle cx="60" cy="60" r="60" fill="#fef9c3"/>
  <!-- Hair (long) -->
  <ellipse cx="60" cy="28" rx="26" ry="20" fill="#1a0a00"/>
  <rect x="34" y="30" width="8" height="40" fill="#1a0a00" rx="4"/>
  <rect x="78" y="30" width="8" height="40" fill="#1a0a00" rx="4"/>
  <ellipse cx="60" cy="42" rx="28" ry="16" fill="#1a0a00"/>
  <!-- Face -->
  <ellipse cx="60" cy="52" rx="21" ry="23" fill="#f8d5a3"/>
  <!-- Eyes -->
  <ellipse cx="52" cy="50" rx="3.5" ry="3.8" fill="#fff"/>
  <ellipse cx="68" cy="50" rx="3.5" ry="3.8" fill="#fff"/>
  <circle cx="53" cy="51" r="2.2" fill="#3d1500"/>
  <circle cx="69" cy="51" r="2.2" fill="#3d1500"/>
  <circle cx="54" cy="50" r="0.8" fill="#fff"/>
  <circle cx="70" cy="50" r="0.8" fill="#fff"/>
  <!-- Eyebrows (thin arched) -->
  <path d="M48 44 Q52 42 56 44" stroke="#1a0a00" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <path d="M64 44 Q68 42 72 44" stroke="#1a0a00" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <!-- Nose -->
  <ellipse cx="60" cy="57" rx="2" ry="1.5" fill="#d4a07a" opacity=".5"/>
  <!-- Smile -->
  <path d="M54 64 Q60 70 66 64" stroke="#c07850" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <!-- Ears -->
  <ellipse cx="39" cy="52" rx="4" ry="6" fill="#f8d5a3"/>
  <ellipse cx="81" cy="52" rx="4" ry="6" fill="#f8d5a3"/>
  <!-- Earrings -->
  <circle cx="39" cy="59" r="2.5" fill="#f59e0b"/>
  <circle cx="81" cy="59" r="2.5" fill="#f59e0b"/>
  <!-- Neck -->
  <rect x="54" y="73" width="12" height="10" fill="#f8d5a3"/>
  <!-- Kurti -->
  <path d="M28 92 Q60 78 92 92 Q92 120 28 120 Z" fill="#8b5cf6"/>
  <path d="M50 78 Q60 86 70 78" stroke="#7c3aed" stroke-width="2" fill="none"/>
  <!-- Bindi -->
  <circle cx="60" cy="43" r="2.2" fill="#dc2626"/>
  <!-- Hair parting line -->
  <line x1="60" y1="22" x2="60" y2="34" stroke="#4a2000" stroke-width="1" opacity=".5"/>
