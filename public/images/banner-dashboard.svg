<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" fill="none">
  <!-- Sky background -->
  <rect width="520" height="200" fill="url(#skyGrad)"/>
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="520" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#1a3a6b"/>
    </linearGradient>
  </defs>
  <!-- Stars -->
  <circle cx="30"  cy="20"  r="1.2" fill="#fcd34d" opacity=".7"/>
  <circle cx="80"  cy="10"  r="1"   fill="#fcd34d" opacity=".5"/>
  <circle cx="200" cy="15"  r="1.5" fill="#fcd34d" opacity=".8"/>
  <circle cx="310" cy="8"   r="1"   fill="#fcd34d" opacity=".6"/>
  <circle cx="430" cy="18"  r="1.3" fill="#fcd34d" opacity=".7"/>
  <circle cx="490" cy="12"  r="1"   fill="#fcd34d" opacity=".5"/>
  <!-- School Building -->
  <rect x="160" y="80" width="200" height="110" fill="#112952" rx="4"/>
  <rect x="140" y="88" width="240" height="102" fill="#1a3a6b" rx="4"/>
  <!-- Roof -->
  <polygon points="130,88 260,38 390,88" fill="#0d1f3c"/>
  <polygon points="136,88 260,42 384,88" fill="#1e4d8c"/>
  <!-- Roof cap / Graduation cap -->
  <rect x="240" y="34" width="40" height="6" fill="#f59e0b" rx="2"/>
  <rect x="257" y="22" width="6" height="16" fill="#f59e0b"/>
  <polygon points="240,22 260,12 280,22" fill="#fbbf24"/>
  <!-- Windows row 1 -->
  <rect x="175" y="105" width="28" height="28" fill="#3b82d4" rx="3" opacity=".9"/>
  <rect x="236" y="105" width="28" height="28" fill="#3b82d4" rx="3" opacity=".9"/>
  <rect x="297" y="105" width="28" height="28" fill="#3b82d4" rx="3" opacity=".9"/>
  <!-- Window cross lines -->
  <line x1="189" y1="105" x2="189" y2="133" stroke="#1a3a6b" stroke-width="1.5"/>
  <line x1="175" y1="119" x2="203" y2="119" stroke="#1a3a6b" stroke-width="1.5"/>
  <line x1="250" y1="105" x2="250" y2="133" stroke="#1a3a6b" stroke-width="1.5"/>
  <line x1="236" y1="119" x2="264" y2="119" stroke="#1a3a6b" stroke-width="1.5"/>
  <line x1="311" y1="105" x2="311" y2="133" stroke="#1a3a6b" stroke-width="1.5"/>
  <line x1="297" y1="119" x2="325" y2="119" stroke="#1a3a6b" stroke-width="1.5"/>
  <!-- Door -->
  <rect x="240" y="148" width="40" height="42" fill="#0a1628" rx="3"/>
  <circle cx="276" cy="170" r="2.5" fill="#f59e0b"/>
  <!-- Columns -->
  <rect x="155" y="88" width="10" height="102" fill="#112952" rx="2"/>
  <rect x="355" y="88" width="10" height="102" fill="#112952" rx="2"/>
  <!-- Flag pole -->
  <rect x="258" y="12" width="4" height="12" fill="#f59e0b"/>
  <!-- Ground -->
  <rect x="0" y="188" width="520" height="12" fill="#0d1f3c"/>
  <!-- Path -->
  <rect x="232" y="175" width="56" height="13" fill="#1e4d8c" opacity=".5"/>
  <!-- Trees -->
  <rect x="100" y="145" width="8" height="45" fill="#0d1f3c"/>
  <ellipse cx="104" cy="135" rx="22" ry="26" fill="#1a5c2a" opacity=".9"/>
  <ellipse cx="104" cy="128" rx="16" ry="20" fill="#22863a" opacity=".8"/>
  <rect x="390" y="145" width="8" height="45" fill="#0d1f3c"/>
  <ellipse cx="394" cy="135" rx="22" ry="26" fill="#1a5c2a" opacity=".9"/>
  <ellipse cx="394" cy="128" rx="16" ry="20" fill="#22863a" opacity=".8"/>
  <!-- Small trees -->
  <rect x="60" y="158" width="6" height="32" fill="#0d1f3c"/>
  <ellipse cx="63" cy="150" rx="16" ry="18" fill="#1a5c2a" opacity=".8"/>
  <rect x="440" y="158" width="6" height="32" fill="#0d1f3c"/>
  <ellipse cx="443" cy="150" rx="16" ry="18" fill="#1a5c2a" opacity=".8"/>
  <!-- Sign board -->
  <rect x="195" y="68" width="130" height="18" fill="#f59e0b" rx="3"/>
  <text x="260" y="81" font-family="Arial" font-size="9" font-weight="bold" fill="#0a1628" text-anchor="middle">HEMANTH HIGH SCHOOL</text>
  <!-- Gold coins decorative right -->
  <circle cx="460" cy="80" r="18" fill="#f59e0b" opacity=".15"/>
  <circle cx="460" cy="80" r="13" fill="#f59e0b" opacity=".2"/>
  <text x="460" y="85" font-family="Arial" font-size="14" font-weight="bold" fill="#fbbf24" text-anchor="middle" opacity=".8">₹</text>
  <circle cx="490" cy="120" r="12" fill="#f59e0b" opacity=".1"/>
  <circle cx="490" cy="120" r="8"  fill="#f59e0b" opacity=".15"/>
  <text x="490" y="125" font-family="Arial" font-size="10" font-weight="bold" fill="#fbbf24" text-anchor="middle" opacity=".6">₹</text>
  <!-- Left decorative cap -->
  <circle cx="50" cy="90" r="22" fill="#1e4d8c" opacity=".3"/>
  <text x="50" y="98" font-family="Arial" font-size="22" text-anchor="middle" opacity=".6">🎓</text>
</svg>
